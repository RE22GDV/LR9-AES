[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr9-aes"
version = "1.0.0"
description = "Лабораторна робота №9: AES і режими шифрування, програма AES Studio"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8", "numpy>=1.24", "pillow>=10.0", "cryptography>=41"]

[project.scripts]
aeslab = "aeslab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Тести Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Встановити залежності
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography

      - name: Офіційні тестові вектори
        run: python run.py selftest

      - name: Повний набір тестів
        run: python -m pytest -q --ignore=tests/test_cross_and_gui.py

  launchers:
    name: Запуск на ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Скрипт запуску (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x aes_studio.sh AES_Studio.command
          ./aes_studio.sh selftest
          ./AES_Studio.command selftest

      - name: Скрипт запуску (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: AES_Studio.bat selftest

      - name: Інтерфейс на віртуальному дисплеї (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          pip install pytest
          xvfb-run -a python -m pytest -q tests/test_cross_and_gui.py -k test_gui

  csharp:
    name: "C#: AES-CTR"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Вектори NIST і перевірка CTR
        run: dotnet run --project csharp/AesCtrDemo -- selftest

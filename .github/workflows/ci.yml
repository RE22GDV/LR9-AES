name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Тести Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Встановити залежності
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography

      - name: Офіційні тестові вектори
        run: python run.py selftest

      - name: Повний набір тестів
        run: python -m pytest -q --ignore=tests/test_cross_and_gui.py

  csharp:
    name: C#: AES-CTR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Вектори NIST і перевірка CTR
        run: dotnet run --project csharp/AesCtrDemo -- selftest
